defaults:
  seed: 0
  train_cfgs:
    device: cpu
    torch_threads: 16
    vector_env_nums: 1
    parallel: 1
    total_steps: 1000000
    eval_episodes: 1
  algo_cfgs:
    steps_per_epoch: 2000
    update_cycle: 1
    update_iters: 1
    size: 1000000
    batch_size: 256
    reward_normalize: False
    cost_normalize: True
    obs_normalize: False
    max_grad_norm: 40
    use_critic_norm: False
    critic_norm_coeff: 0.001
    polyak: 0.005
    gamma: 0.99
    start_learning_steps: 10000
    policy_delay: 2
    use_exploration_noise: False
    exploration_noise: 0.1
    policy_noise: 0.2
    policy_noise_clip: 0.5
    alpha: 0.2
    auto_alpha: False
    use_cost: True
    warmup_epochs: 100
    damp_scale: 10.0
    # ====== IQN 专用参数 ======
    iqn_n_quantiles: 32
    iqn_kappa: 1.0
    cvar_quantile_samples: 32
  logger_cfgs:
    use_wandb: False
    wandb_project: omnisafe
    use_tensorboard: True
    save_model_freq: 100
    log_dir: "./runs"
    window_lens: 10
  model_cfgs:
    weight_initialization_mode: "kaiming_uniform"
    actor_type: gaussian_sac
    linear_lr_decay: False
    actor:
      hidden_sizes: [256, 256]
      activation: tanh
      lr: 0.0003
    critic:
      num_critics: 2
      hidden_sizes: [256, 256]
      activation: tanh
      lr: 0.0003
      iqn_embedding_dim: 64
  lagrange_cfgs:
    # cost_limit: 25.0
    cost_limit: 5.0
    lagrangian_multiplier_init: 0.001
    lambda_lr: 0.00001
    lambda_optimizer: "Adam"
    cvar_alpha: 0.9


SafetyCarCircle1-v0:
  algo_cfgs:
    alpha: 0.00001
    cost_normalize: False
  model_cfgs:
    actor:
      lr: 0.000005
    critic:
      lr: 0.001
  lagrange_cfgs:
    cost_limit: 5.0
    # cost_limit: 25.0
    lagrangian_multiplier_init: 0.000
    lambda_lr: 0.0000005
    lambda_optimizer: "Adam"

